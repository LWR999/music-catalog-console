<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Catalog Console</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <span class="app-icon">♫</span>
      <h1 class="app-title">Music Catalog Console</h1>
    </div>
    <div class="header-right">
      <span id="album-count" class="album-count"></span>
      <button id="theme-toggle" class="btn-icon" title="Toggle dark/light mode">☀</button>
    </div>
  </header>

  <div class="app-layout">

    <aside class="sidebar">

      <section class="sidebar-section">
        <h2 class="sidebar-heading">Filters</h2>
        <div class="filter-group">
          <input type="text" id="search" class="input" placeholder="Search artist or album…" autocomplete="off" spellcheck="false">
        </div>
        <div class="filter-group">
          <select id="genre-filter" class="input">
            <option value="">All Genres</option>
          </select>
        </div>
        <div class="filter-group filter-inline">
          <label class="checkbox-label">
            <input type="checkbox" id="compilation-filter">
            <span>Compilations only</span>
          </label>
        </div>
        <div class="filter-group">
          <select id="sort-select" class="input">
            <option value="artist">Sort: Artist</option>
            <option value="title">Sort: Album Title</option>
            <option value="year_desc">Sort: Year (newest first)</option>
            <option value="year_asc">Sort: Year (oldest first)</option>
            <option value="added">Sort: Recently Added</option>
            <option value="play_count_desc">Sort: Most Played</option>
          </select>
        </div>
        <button id="btn-clear-filters" class="btn btn-ghost btn-sm">Clear Filters</button>
      </section>

      <section class="sidebar-section">
        <h2 class="sidebar-heading">Scrape Controls</h2>
        <div class="scrape-buttons">
          <button id="btn-incremental-scrape" class="btn btn-primary">Incremental Rescrape</button>
          <button id="btn-full-scrape" class="btn btn-danger">Full Rescrape</button>
          <button id="btn-genre-normalise" class="btn btn-secondary">Genre Normalise</button>
        </div>
        <div id="scrape-panel" class="scrape-panel hidden">
          <div class="scrape-panel-header">
            <span id="scrape-status" class="scrape-status">Running…</span>
            <button id="btn-close-log" class="btn-icon-sm" title="Close log">×</button>
          </div>
          <div id="scrape-log" class="scrape-log"></div>
        </div>
      </section>

    </aside>

    <main class="content">
      <div id="tile-grid" class="tile-grid"></div>
      <div id="grid-status" class="grid-status hidden">
        <span id="status-text"></span>
      </div>
      <div id="load-more-container" class="load-more-container hidden">
        <button id="btn-load-more" class="btn btn-ghost">Load More</button>
      </div>
    </main>

  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close">×</button>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
